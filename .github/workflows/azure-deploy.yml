name: Deploy to Azure

# Builds the Docker image and rolls it out to the Container App created by
# infra/azure-provision.sh. Runs on every push to main, and can also be
# triggered manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: mjd-wellness-rg
  CONTAINER_APP_NAME: mjd-wellness-app
  ACR_NAME: mjdwellnessacr

permissions:
  id-token: write   # required for OIDC login (azure/login)
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC — no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the container registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        env:
          IMAGE: ${{ env.ACR_NAME }}.azurecr.io/mjd-wellness-app
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_SUPABASE_PROJECT_ID="${{ secrets.VITE_SUPABASE_PROJECT_ID }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy the new image
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/mjd-wellness-app:${{ github.sha }}

      - name: Show the live URL
        run: |
          az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv
